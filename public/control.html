<!DOCTYPE html>
<html lang="zh-CN" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1f4d3a" />
    <title>手机控制 · 喂奶计时</title>
    <link rel="stylesheet" href="/css/shared.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="brand">手机控制</h1>
      <p class="lead">设定时间后，Kindle 显示页会同步更新已过时长。</p>

      <section class="panel stack">
        <div id="status" class="status">读取中…</div>
        <button id="startNow" class="btn block" type="button">
          宝宝刚吃完（从现在计时）
        </button>
        <button id="clearBtn" class="btn secondary block" type="button">
          清空计时
        </button>
      </section>

      <section class="panel" style="margin-top: 16px">
        <h2>指定开始时间</h2>
        <form id="setForm" class="stack">
          <div class="field">
            <label for="startedAt">上次吃奶时间</label>
            <input id="startedAt" name="startedAt" type="datetime-local" required />
          </div>
          <button class="btn block" type="submit">保存这个时间</button>
        </form>
      </section>

      <section class="panel" style="margin-top: 16px">
        <h2>远程文字（可选）</h2>
        <div class="stack">
          <div class="field">
            <label for="message">显示在 Kindle 上的文字</label>
            <textarea
              id="message"
              rows="3"
              maxlength="200"
              placeholder="例如：记得喝水"
            ></textarea>
          </div>
          <button id="sendText" class="btn block" type="button">发送文字</button>
          <button id="backToTimer" class="btn secondary block" type="button">
            切回计时显示
          </button>
        </div>
      </section>

      <section class="panel" style="margin-top: 16px">
        <h2>访问令牌</h2>
        <p class="hint">
          若服务器设置了 ACCESS_TOKEN，在此填写一次即可保存在手机浏览器。
        </p>
        <div class="field" style="margin-top: 10px">
          <label for="token">ACCESS_TOKEN</label>
          <input id="token" type="password" autocomplete="off" placeholder="可选" />
        </div>
      </section>

      <p id="toast" class="toast" style="margin-top: 16px" aria-live="polite"></p>
      <p class="hint" style="margin-top: 8px">
        <a href="/">返回首页</a> ·
        <a href="/display.html">打开 Kindle 显示页</a>
      </p>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/control.js"></script>
  </body>
</html>
