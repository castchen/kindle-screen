<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f4d3a" />
    <title>喂奶计时 · Kindle 屏</title>
    <link rel="stylesheet" href="/css/shared.css" />
  </head>
  <body>
    <main class="shell">
      <h1 class="brand">喂奶计时</h1>
      <p class="lead">
        手机设定宝宝上次吃奶时间，Kindle 浏览器全屏大字显示已经过了多久。
      </p>

      <div class="nav-links">
        <a class="btn block" href="/control.html">手机控制页</a>
        <a class="btn secondary block" href="/display.html">Kindle 显示页</a>
      </div>

      <section class="panel" style="margin-top: 24px">
        <h2>Kindle 怎么用</h2>
        <p class="hint">
          1. Kindle 连上同一套可访问此服务的网络（或公网域名）<br />
          2. 打开实验性浏览器，访问本站的「Kindle 显示页」<br />
          3. 尽量横屏、全屏浏览；页面会自动刷新计时<br />
          4. 用手机打开「控制页」，点「宝宝刚吃完」即可
        </p>
      </section>
    </main>
  </body>
</html>
